apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: policy-worker
  description: Cloudflare Worker for policy authorization decisions
spec:
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture }
      - { path: docs/runbook.md, role: runbook }
  type: cloudflare-worker-turbo
  lifecycle: production
  owner: platform
  domain: starter-runtime
  path: apps/policy-worker
  # This worker BUNDLES @saas/policy-engine — the action registry and the
  # role→permission grants are compiled into the deployed script, not read at
  # runtime. The edge was missing, so the graph did not know policy-engine had
  # a single dependent.
  #
  # It cost a production outage. SP0 added eleven prospecting actions to the
  # engine's `ALL_KNOWN_ACTIONS`; `orun plan --changed` planned `policy-engine`
  # and nothing else, so this worker kept serving a pre-SP0 bundle for the whole
  # epic. Every prospecting authorize hit `deny("unknown_action")`, and
  # prospecting-worker's deny-as-404 turned that into the console's "not_found".
  # The product was deployed, wired, and migrated — and unreachable.
  #
  # NOTE: `dependsOn` is deploy ORDERING and graph truth. It does NOT propagate
  # change detection: `orun plan --changed` is strictly path-based, so a future
  # policy-engine-only commit will still not replan this worker. See the runbook
  # entry — until orun cascades, an engine change needs this component touched
  # (or planned explicitly with `--component policy-worker`).
  dependsOn:
    - component: policy-engine
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    workspaceDir: ../..
    appDir: .
    # BF6: identity/role inputs for the deploy lane's wire-credentials step.
    # Inert until this worker gets a wrangler template (fleet rollout, BF6b).
    orgName: sourceplane
    owner: sourceplane
    repo: signalpilot

    turboFilter: "@saas/policy-worker"
    wranglerConfig: wrangler.jsonc
    installCommand: pnpm install --frozen-lockfile
    buildCommand: pnpm exec turbo run build --filter=@saas/policy-worker
    typecheckCommand: pnpm exec turbo run typecheck --filter=@saas/policy-worker
    dryRunCommand: pnpm exec wrangler deploy --dry-run --config wrangler.jsonc --env prod
    deployCommand: pnpm exec wrangler deploy --config wrangler.jsonc --env prod
    preDeployCommand: "echo 'No pre-deploy step configured.'"
    migrationCommand: "echo 'No migrations configured.'"
    smokeCommand: "echo 'No smoke test configured.'"
  labels:
    team: platform
    layer: runtime
    surface: policy
    runtime: cloudflare
# ci: trigger full-component verification (orun v2.12.0 upgrade — PR #183)
