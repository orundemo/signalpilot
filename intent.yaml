apiVersion: sourceplane.io/v1
kind: Intent

metadata:
  name: signalpilot
  description: Reusable Cloudflare and Supabase multi-tenant SaaS starter
  namespace: sourceplane

execution:
  state:
    backendUrl: https://api-edge-prod.oruncloud.workers.dev
    # Declared, enforced tenancy: the workspace claim is sent on every remote op
    # (including the credential-free CI OIDC exchange) so orun-cloud can enforce
    # claim ⊆ authorized. Declaring it implies strict mode — a non-interactive
    # run that resolves no workspace fails fast (specs/oidc-ci-tenancy §4.1).
    # `workspace` is the leading spelling in orun v2.20.0 (a ws_ Workspace ID,
    # slug, or legacy org_ id); it supersedes the deprecated `org:` alias.
    workspace: org_0302a165c98c4d529e288edf2d9428c4
    project: signalpilot
    requireOrg: true
    # Push/sync the resolved catalog to orun-cloud after a successful plan on the
    # default branch, keeping the org-global catalog head fresh without an
    # explicit `--push-catalog`.
    autopushCatalog: true

compositions:
  sources:
    # The composition stack lives in sourceplane/stack-tectonic and is consumed
    # as a published OCI artifact rather than a repo-local directory. Pin an
    # explicit version: a bare repository reference resolves to `:latest`, which
    # would let a catalog release change this repo's execution contracts without
    # a commit here. Bumping the tag is the deliberate upgrade step.
    - name: stack-tectonic
      kind: oci
      ref: oci://ghcr.io/sourceplane/stack-tectonic:0.18.2
  resolution:
    precedence:
      - stack-tectonic
    bindings:
      terraform: stack-tectonic
      cloudflare-domain: stack-tectonic
      db-migrate: stack-tectonic

discovery:
  roots:
    - apps/
    - infra/
    - packages/
    - tests/

automation:
  triggerBindings:
    github-pull-request:
      description: Pull request validation
      on:
        provider: github
        event: pull_request
        actions:
          - opened
          - synchronize
          - reopened
          - ready_for_review
        baseBranches:
          - main
      plan:
        scope: changed
        base: pull_request.base.sha
        head: pull_request.head.sha

    github-push-main:
      description: Main branch stack convergence after merge
      on:
        provider: github
        event: push
        branches:
          - main

    local-development:
      description: Local testing with full Terraform execution
      on:
        provider: local

environments:
  dev:
    activation:
      triggerRefs:
        - github-pull-request
        - github-push-main
        - local-development
    parameterDefaults:
      terraform:
        lane: verify
        namespace: sourceplane
        namespacePrefix: dev-
        owner: sourceplane
        repo: signalpilot
        CONSOLE_CUSTOM_DOMAIN: ""
    policies:
      requireApproval: "false"
    env:
      BASE_DOMAIN: signalpilot.orun.new

  stage:
    activation:
      triggerRefs:
        - github-pull-request
        - github-push-main
    parameterDefaults:
      terraform:
        lane: verify
        namespace: sourceplane
        namespacePrefix: stg-
        owner: sourceplane
        repo: signalpilot
        CONSOLE_CUSTOM_DOMAIN: stage.signalpilot.orun.new
    policies:
      requireApproval: "false"
    env:
      BASE_DOMAIN: signalpilot.orun.new

  prod:
    activation:
      triggerRefs:
        - github-pull-request
        - github-push-main
    promotion:
      dependsOn:
        - environment: stage
    parameterDefaults:
      terraform:
        lane: verify
        namespace: sourceplane
        namespacePrefix: prod-
        owner: sourceplane
        repo: signalpilot
        CONSOLE_CUSTOM_DOMAIN: prod.signalpilot.orun.new
    policies:
      requireApproval: "false"
    env:
      BASE_DOMAIN: signalpilot.orun.new

# Repo-level catalog entity: front page + role-tagged docs (rendered in
# the workspace Docs library, pinned to the commit by `orun plan`).
repo:
  displayName: signalpilot
  docs:
    overview: README.md
    pages:
      - { path: ai/context/operations.md, role: runbook, title: Operating contract }
      - { path: ai/context/deployment.md, role: reference, title: Live deployment manifest }

# Product-level catalog entity. The repo entry above describes the workspace;
# this describes what the workspace is FOR. Pinned to the commit by `orun plan`
# and rendered in the workspace Docs library alongside the component entries.
catalog:
  entities:
    - name: prospecting
      displayName: SignalPilot Prospecting
      kind: product
      description: >-
        B2B prospecting: discovers businesses, derives checkable weaknesses from
        their web presence, scores the opportunity with a per-rule breakdown,
        drafts guardrailed outreach, and moves the result through a pipeline.
      owner: platform
      domain: product
      components:
        - prospecting-worker
        - prospecting-worker-tests
      docs:
        overview: docs/overview.md
        pages:
          - { path: docs/architecture.md, role: architecture, title: Architecture }
          - { path: docs/runbook.md, role: runbook, title: Runbook }
          - { path: specs/epics/prospecting/design.md, role: reference, title: Technical design }
          - { path: specs/epics/prospecting/IMPLEMENTATION-STATUS.md, role: reference, title: As-built record }
